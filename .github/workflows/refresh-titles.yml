name: Refresh drug title index

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Rebuild and deploy even if the title index is unchanged'
        type: boolean
        default: false
  schedule:
    # Monthly — LactMed adds/revises chapters on a roughly monthly cycle
    - cron: '17 4 2 * *'
  push:
    paths:
      - scripts/fetch-titles.mjs
      - .github/workflows/refresh-titles.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh title index
        run: node scripts/fetch-titles.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/drugTitles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Title index unchanged — nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Title index changed:"
            git diff --stat src/data/drugTitles.json
          fi

      - name: Commit and push updated index
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/drugTitles.json
          git commit -m "Refresh LactMed drug title index [skip ci]"
          # Rebase on anything pushed since checkout (e.g. keepalive) before push.
          git pull --rebase --autostash origin main || true
          git push

      - name: Build
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: npx wrangler pages deploy dist --project-name lactia
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
